name: Build r/music iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Compose Multiplatform iOS Framework
        working-directory: SimpMusic-dev
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode -Pkotlin.native.cocoapods.target=ios -PCONFIGURATION=Release -PPLATFORM_NAME=iphoneos -PARCH=arm64 || ./gradlew :composeApp:packForXcode || true

      - name: Build iOS Application Archive
        working-directory: SimpMusic-dev
        run: |
          cd iosApp
          xcodebuild archive \
            -project SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/SimpMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        working-directory: SimpMusic-dev
        run: |
          mkdir -p build/Payload
          cp -R build/SimpMusic.xcarchive/Products/Applications/SimpMusic.app build/Payload/
          cd build
          zip -r r-music.ipa Payload
          echo "IPA created successfully at build/r-music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-music-iOS-ipa
          path: SimpMusic-dev/build/r-music.ipa
          if-no-files-found: error
