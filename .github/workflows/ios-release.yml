name: Build r/music iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build Compose Multiplatform iOS Framework
        working-directory: SimpMusic-dev
        run: |
          chmod +x ./gradlew
          export GRADLE_OPTS="-Xmx8192m -XX:+UseParallelGC"
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 \
            -Dorg.gradle.jvmargs="-Xmx8192m -XX:+UseParallelGC" \
            -Pkotlin.native.jvmArgs="-Xmx8192m" \
            --no-configuration-cache --stacktrace
          mkdir -p iosApp/Frameworks
          cp -R composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework iosApp/Frameworks/

      - name: Build iOS Application Archive
        working-directory: SimpMusic-dev
        run: |
          cd iosApp
          set -o pipefail
          FRAMEWORK_DIR="$(pwd)/../composeApp/build/bin/iosArm64/releaseFramework"
          xcodebuild archive \
            -project SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/SimpMusic.xcarchive" \
            FRAMEWORK_SEARCH_PATHS="\"$FRAMEWORK_DIR\" \"$(pwd)/Frameworks\"" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build.log || (echo "=== XCODEBUILD FAILED - ERROR SUMMARY ===" && grep -E "error:|fatal error:" build.log && exit 1)

      - name: Package IPA
        working-directory: SimpMusic-dev
        run: |
          mkdir -p build/Payload
          cp -R build/SimpMusic.xcarchive/Products/Applications/SimpMusic.app build/Payload/
          cp iosApp/SimpMusic/Assets.xcassets/AppIcon.appiconset/icon_1024.png build/Payload/SimpMusic.app/iTunesArtwork@2x.png || true
          cp iosApp/SimpMusic/Assets.xcassets/AppIcon.appiconset/icon_120.png build/Payload/SimpMusic.app/AppIcon60x60@2x.png || true
          cp iosApp/SimpMusic/Assets.xcassets/AppIcon.appiconset/icon_180.png build/Payload/SimpMusic.app/AppIcon60x60@3x.png || true
          cp iosApp/SimpMusic/Assets.xcassets/AppIcon.appiconset/icon_1024.png build/Payload/SimpMusic.app/AppIcon.png || true
          cp iosApp/SimpMusic/AppIcon-*.png build/Payload/SimpMusic.app/ || true
          cd build
          zip -r r-music.ipa Payload
          echo "IPA created successfully at build/r-music.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-music-iOS-ipa
          path: SimpMusic-dev/build/r-music.ipa
          if-no-files-found: error
